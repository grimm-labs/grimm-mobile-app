appId: ${APP_ID}
name: Settings - Breez SDK details, About and Help
tags:
  - settings
---
- runFlow: subflows/create-wallet.yaml
- runFlow: subflows/wait-for-lightning.yaml
# Developers > Breez SDK: deposits are loaded once the SDK is connected
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM_ID: settings-breez-sdk
- extendedWaitUntil:
    visible:
      id: 'breez-sdk-screen'
    timeout: 10000
- assertVisible:
    id: 'breez-sdk-balance'
- extendedWaitUntil:
    visible:
      id: 'breez-sdk-deposits-status-value'
      text: 'Last refresh at .*'
    timeout: 60000
- assertVisible:
    id: 'breez-sdk-deposits-value'
- tapOn:
    id: 'breez-sdk-refresh'
- extendedWaitUntil:
    visible:
      id: 'breez-sdk-deposits-status-value'
      text: 'Last refresh at .*'
    timeout: 60000
# Export the SDK logs: the SDK has written them since it connected, so the share sheet opens (no message)
- scrollUntilVisible:
    element:
      id: 'breez-sdk-export-logs'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'breez-sdk-export-logs'
    waitToSettleTimeoutMs: 500
- assertNotVisible: 'No SDK logs yet'
- assertNotVisible: 'Could not export the SDK logs'
- assertNotVisible: 'Sharing is not available on this device'
# Back closes the share sheet
- back
- extendedWaitUntil:
    visible:
      id: 'breez-sdk-screen'
    timeout: 10000
- back
# About
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM_ID: settings-about
- extendedWaitUntil:
    visible:
      id: 'about-screen'
    timeout: 10000
- assertVisible:
    id: 'about-version'
    text: 'Version \d+\.\d+\.\d+.*'
- assertVisible: 'Terms of Service'
- assertVisible: 'Privacy Policy'
- back
# Help & Support
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM_ID: settings-help
- extendedWaitUntil:
    visible:
      id: 'need-help-screen'
    timeout: 10000
- assertVisible:
    id: 'need-help-support-items'
- back
- assertVisible:
    id: 'settings-screen'
# The app version closes the Settings list
- scrollUntilVisible:
    element:
      id: 'settings-version'
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: 'settings-version'
    text: 'Version \d+\.\d+\.\d+.*'
