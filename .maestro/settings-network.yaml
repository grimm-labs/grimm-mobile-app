appId: ${APP_ID}
name: Settings - switch network (testnet and back to mainnet)
tags:
  - settings
  - network
---
- runFlow: subflows/create-wallet.yaml
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM_ID: settings-networks
- extendedWaitUntil:
    visible:
      id: 'network-status'
      text: 'Connected to mainnet'
    timeout: 120000
- assertVisible:
    id: 'network-option-mainnet-selected'
# Options are disabled while the wallet syncs
- extendedWaitUntil:
    visible:
      id: 'network-option-testnet'
      enabled: true
    timeout: 60000
- tapOn:
    id: 'network-option-testnet'
- extendedWaitUntil:
    visible:
      id: 'network-option-testnet-selected'
    timeout: 30000
- back
- tapOn:
    id: 'tab-index'
- extendedWaitUntil:
    visible:
      id: 'home-network-warning'
    timeout: 30000
- assertVisible: 'You are connected to Test Network'
# Back to mainnet: a confirmation is required, Cancel keeps testnet
- runFlow:
    file: subflows/open-settings-item.yaml
    env:
      ITEM_ID: settings-networks
- extendedWaitUntil:
    visible:
      id: 'network-option-mainnet'
      enabled: true
    timeout: 60000
- tapOn:
    id: 'network-option-mainnet'
- assertVisible: 'Switch to Mainnet'
- tapOn: '(?i)cancel'
- assertVisible:
    id: 'network-option-testnet-selected'
- extendedWaitUntil:
    visible:
      id: 'network-option-mainnet'
      enabled: true
    timeout: 60000
- tapOn:
    id: 'network-option-mainnet'
- tapOn: '(?i)switch'
- extendedWaitUntil:
    visible:
      id: 'network-option-mainnet-selected'
    timeout: 30000
- back
- tapOn:
    id: 'tab-index'
- extendedWaitUntil:
    notVisible:
      id: 'home-network-warning'
    timeout: 30000
