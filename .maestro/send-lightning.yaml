appId: ${APP_ID}
name: Send via Lightning - input validation and an address pasted on the Lightning screen
tags:
  - send
  - lightning
---
- runFlow: subflows/create-wallet.yaml
- runFlow: subflows/wait-for-lightning.yaml
- tapOn:
    id: 'home-send-button'
- tapOn:
    id: 'send-method-lightning'
- extendedWaitUntil:
    visible:
      id: 'send-ln-address-screen'
    timeout: 10000
# Empty input
- tapOn:
    id: 'send-ln-address-continue'
- assertVisible: 'Please enter a valid Lightning invoice'
# Not an invoice nor an address
- tapOn:
    id: 'send-ln-address-input'
- inputText: 'not-an-invoice'
- hideKeyboard
- tapOn:
    id: 'send-ln-address-continue'
- assertVisible: 'Sorry, we do not support this Bitcoin or Lightning address'
# A Bitcoin address pasted on the Lightning screen opens the on-chain amount screen (BIP173 test vector)
- tapOn:
    id: 'send-ln-address-input'
- eraseText: 30
- inputText: 'bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4'
- hideKeyboard
- tapOn:
    id: 'send-ln-address-continue'
- extendedWaitUntil:
    visible:
      id: 'send-onchain-amount-screen'
    timeout: 20000
