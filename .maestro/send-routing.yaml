appId: ${APP_ID}
name: Send - Payment Input routing (Bitcoin URI, method sheet, Invoice without an Amount, other networks)
tags:
  - send
  - routing
# BOLT 11 test vectors (expired, which the routing allows): the mainnet "Please consider supporting this project"
# Invoice without an Amount, and the testnet Invoice with a fallback address. BIP173 test vectors for the addresses.
env:
  ADDRESS: bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4
  TESTNET_ADDRESS: tb1qw508d6qejxtdg4y5r3zarvary0c5xw7kxpjzsx
  NO_AMOUNT_INVOICE: 
  TESTNET_INVOICE: 
---
- runFlow: subflows/create-wallet.yaml
- runFlow: subflows/wait-for-lightning.yaml
# Bitcoin URI with an amount: the on-chain amount screen, pre-filled
- runFlow:
    file: subflows/paste-on-lightning-screen.yaml
    env:
      PAYMENT_INPUT: 'bitcoin:${ADDRESS}?amount=0.0001'
- extendedWaitUntil:
    visible:
      id: 'send-onchain-amount-screen'
    timeout: 20000
- assertVisible:
    id: 'send-onchain-amount-value'
    text: '10000'
- runFlow: subflows/back-to-home.yaml
# The same URI with an Invoice: the method sheet. On-chain keeps the amount
- runFlow:
    file: subflows/paste-on-lightning-screen.yaml
    env:
      PAYMENT_INPUT: 'bitcoin:${ADDRESS}?amount=0.0001&lightning=${NO_AMOUNT_INVOICE}'
- extendedWaitUntil:
    visible:
      id: 'send-method-onchain'
    timeout: 10000
- assertVisible:
    id: 'send-method-lightning'
- tapOn:
    id: 'send-method-onchain'
- extendedWaitUntil:
    visible:
      id: 'send-onchain-amount-screen'
    timeout: 20000
- assertVisible:
    id: 'send-onchain-amount-value'
    text: '10000'
- runFlow: subflows/back-to-home.yaml
# The same URI, Lightning: the Invoice has no Amount, so the Lightning amount screen
- runFlow:
    file: subflows/paste-on-lightning-screen.yaml
    env:
      PAYMENT_INPUT: 'bitcoin:${ADDRESS}?amount=0.0001&lightning=${NO_AMOUNT_INVOICE}'
- extendedWaitUntil:
    visible:
      id: 'send-method-lightning'
    timeout: 10000
- tapOn:
    id: 'send-method-lightning'
- extendedWaitUntil:
    visible:
      id: 'send-ln-amount-screen'
    timeout: 30000
- runFlow: subflows/back-to-home.yaml
# The Invoice without an Amount alone: "Send to" shows its description
- runFlow:
    file: subflows/paste-on-lightning-screen.yaml
    env:
      PAYMENT_INPUT: ${NO_AMOUNT_INVOICE}
- extendedWaitUntil:
    visible:
      id: 'send-ln-amount-send-to'
      text: 'Send to Please consider supporting this project'
    timeout: 30000
- runFlow: subflows/back-to-home.yaml
# A testnet address on mainnet
- runFlow:
    file: subflows/paste-on-lightning-screen.yaml
    env:
      PAYMENT_INPUT: ${TESTNET_ADDRESS}
- assertVisible: 'This address belongs to another Bitcoin network'
- assertVisible:
    id: 'send-ln-address-screen'
- runFlow: subflows/back-to-home.yaml
# A testnet Invoice on mainnet
- runFlow:
    file: subflows/paste-on-lightning-screen.yaml
    env:
      PAYMENT_INPUT: ${TESTNET_INVOICE}
- extendedWaitUntil:
    visible: 'This invoice belongs to another Bitcoin network'
    timeout: 10000
- assertVisible:
    id: 'send-ln-address-screen'
