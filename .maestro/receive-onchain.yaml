appId: ${APP_ID}
name: Receive on-chain - Bitcoin address and Lightning deposit address
tags:
  - receive
  - onchain
---
- runFlow: subflows/create-wallet.yaml
- tapOn:
    id: 'home-receive-button'
- tapOn:
    id: 'receive-method-onchain'
# The address needs the Esplora indexer; retry if the wallet was not connected yet
- extendedWaitUntil:
    notVisible:
      id: 'receive-btc-loading'
    timeout: 60000
- repeat:
    while:
      visible:
        id: 'receive-btc-error'
    times: 5
    commands:
      - tapOn:
          id: 'receive-btc-retry'
      - extendedWaitUntil:
          notVisible:
            id: 'receive-btc-loading'
          timeout: 60000
- assertVisible:
    id: 'receive-btc-screen'
- assertVisible: 'Scan this QR code to send funds to this address'
# Native SegWit mainnet address, shown in chunks
- assertVisible:
    id: 'receive-btc-address'
- assertVisible: 'BC1Q.*'
# Copy the address (checked below by pasting it; the 2 s confirmation is too short to assert on CI)
- tapOn:
    id: 'receive-btc-address'
- tapOn:
    id: 'receive-btc-copy'
# Address settings sheet (amount + note)
- tapOn:
    id: 'receive-btc-address-settings'
- assertVisible:
    id: 'address-config-title'
- tapOn:
    id: 'address-config-amount-input'
- inputText: '1000'
- tapOn:
    id: 'address-config-note-input'
- inputText: 'Maestro'
- hideKeyboard
- tapOn:
    id: 'address-config-save'
- assertNotVisible:
    id: 'address-config-title'
# New address
- tapOn:
    id: 'receive-btc-new-address'
- extendedWaitUntil:
    visible:
      id: 'receive-btc-address'
    timeout: 60000
- back
# The copied address is in the clipboard: paste it in the on-chain send screen (address parsing needs Breez)
- runFlow: subflows/wait-for-lightning.yaml
- tapOn:
    id: 'home-send-button'
- tapOn:
    id: 'send-method-onchain'
- extendedWaitUntil:
    visible:
      id: 'send-onchain-address-screen'
    timeout: 10000
- longPressOn:
    id: 'send-onchain-address-input'
- tapOn: 'Paste'
- assertVisible:
    id: 'send-onchain-address-input'
    text: 'bc1q[a-z0-9]+'
- hideKeyboard
- tapOn:
    id: 'send-onchain-address-continue'
- extendedWaitUntil:
    visible:
      id: 'send-onchain-amount-screen'
    timeout: 20000
- back
- back
# Lightning account: on-chain deposit address (Breez)
- tapOn:
    id: 'home-lightning-wallet-card'
- tapOn:
    id: 'ln-wallet-receive-onchain'
- extendedWaitUntil:
    visible:
      id: 'receive-invoice-onchain-info'
    timeout: 60000
- assertVisible:
    id: 'receive-invoice-address'
- assertVisible:
    id: 'receive-invoice-qr'
