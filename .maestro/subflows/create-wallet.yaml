# Fresh install -> Get Started -> Create a new seed phrase -> Home.
# Creating a wallet starts Breez (Lightning) and BDK (on-chain) in the background: use
# wait-for-lightning.yaml before steps that need a connected Breez SDK.
appId: ${APP_ID}
---
- runFlow: launch-fresh-app.yaml
- tapOn:
    id: 'onboarding-get-started'
# Maestro grants permissions at launch, but accept the notification prompt if it still shows up
- runFlow:
    when:
      visible:
        id: 'com.android.permissioncontroller:id/permission_allow_button'
    commands:
      - tapOn:
          id: 'com.android.permissioncontroller:id/permission_allow_button'
- extendedWaitUntil:
    visible:
      id: 'seed-setup-screen'
    timeout: 20000
- tapOn:
    id: 'seed-setup-create'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 60000
- runFlow: dismiss-system-dialogs.yaml
