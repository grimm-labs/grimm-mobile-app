appId: ${APP_ID}
name: Receive via Lightning - amount, note and invoice
tags:
  - receive
  - lightning
---
- runFlow: subflows/create-wallet.yaml
- runFlow: subflows/wait-for-lightning.yaml
- tapOn:
    id: 'home-receive-button'
- tapOn:
    id: 'receive-method-lightning'
- extendedWaitUntil:
    visible:
      id: 'receive-amount-screen'
    timeout: 10000
# Amount keypad
- assertVisible:
    id: 'receive-amount-value'
    text: '0'
- assertVisible:
    id: 'receive-amount-continue'
    enabled: false
- tapOn:
    id: 'numeric-pad-key-1'
- tapOn:
    id: 'numeric-pad-key-2'
- tapOn:
    id: 'numeric-pad-key-3'
- tapOn:
    id: 'numeric-pad-key-4'
- assertVisible:
    id: 'receive-amount-value'
    text: '1234'
- tapOn:
    id: 'delete-key'
- assertVisible:
    id: 'receive-amount-value'
    text: '123'
# The dot is ignored for SATS
- tapOn:
    id: 'numeric-pad-key-dot'
- assertVisible:
    id: 'receive-amount-value'
    text: '123'
- assertVisible:
    id: 'receive-amount-continue'
    enabled: true
# Optional note: add it, clear it, add it again
- tapOn:
    id: 'receive-amount-add-note'
- tapOn:
    id: 'receive-amount-note-input'
- inputText: 'Maestro note'
- tapOn:
    id: 'receive-amount-note-save'
- assertVisible:
    id: 'receive-amount-note-chip'
- assertVisible: 'Maestro note'
- tapOn:
    id: 'receive-amount-note-clear'
- assertNotVisible:
    id: 'receive-amount-note-chip'
- tapOn:
    id: 'receive-amount-add-note'
- tapOn:
    id: 'receive-amount-note-input'
- inputText: 'Maestro invoice'
- tapOn:
    id: 'receive-amount-note-save'
- tapOn:
    id: 'receive-amount-continue'
# Invoice (generated by the Breez SDK)
- extendedWaitUntil:
    visible:
      id: 'receive-invoice-screen'
    timeout: 60000
- assertVisible:
    id: 'receive-invoice-amount'
    text: '123 SATS'
- assertVisible:
    id: 'receive-invoice-note'
    text: 'Maestro invoice'
- assertVisible:
    id: 'receive-invoice-qr'
# Default expiry is 1 hour
- assertVisible:
    id: 'invoice-countdown'
    text: 'This invoice expires in (1:00:00|59:\d{2})'
- tapOn:
    id: 'copy-payment-request'
    waitToSettleTimeoutMs: 500
- assertVisible: 'Payment address has been copied to clipboard'
- tapOn:
    id: 'receive-invoice-close'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 10000
