# Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/e2e-android.yml
# End-to-end testing: https://starter.obytes.com/testing/end-to-end-testing/
# Emulator runner: https://github.com/ReactiveCircus/android-emulator-runner

# Description:
# This workflow is used to run end-to-end tests on Android using Maestro on a GitHub hosted emulator (free, no Maestro Cloud account needed).
# It is the only E2E pipeline of the project: we don't use Maestro Cloud.
# As a first step, it generates a staging test APK (arm64-v8a, see .github/actions/setup-jdk-generate-apk) and uploads it as an artifact.
# A second job starts an Android emulator with `reactivecircus/android-emulator-runner` on ubuntu (KVM) and runs the flows of .maestro/ on it.
# The APK only contains arm64-v8a native libraries (bdk-rn has no x86_64 build), so we use an API 35 google_apis x86_64 image:
# it translates ARM code, which is what lets an arm64-only APK run on the x86_64 runner.
# This workflow runs on every pull request and every push to main/master (changes that only touch markdown files are skipped), and can be manually triggered from the Actions tab.
# On pull requests, a new push cancels the run in progress for the same PR; runs on main/master are never cancelled.
# Manual runs can reuse the APK of a previous run (`apk-run-id`, skips the ~16 min Gradle build when only flows changed)
# and run a subset of the flows (`include-tags`).
# Reports: the JUnit report, Maestro debug output (screenshots, logs) and a logcat dump on failure are uploaded as the `e2e-android-report` artifact.

# GITHUB SECRETS REQUIRED: None
# GITHUB SECRETS OPTIONAL:
# BREEZ_API_KEY: Breez SDK API key (not needed by the current flows).
# GOOGLE_SERVICES_JSON: base64 encoded google-services.json (falls back to the example file when missing).
# GITHUB VARIABLES:
# NOTIFICATION_API_URL_STAGING: notification service URL (a default staging URL is used when missing).

name: E2E Tests Android (Maestro + Github Action)

on:
  workflow_dispatch:
    inputs:
      apk-run-id:
        description: 'Reuse the test APK of a previous run of this workflow (run ID) instead of building it'
        required: false
        default: ''
      include-tags:
        description: 'Only run the flows with one of these Maestro tags (comma separated)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  actions: read # download the APK of another run (apk-run-id)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ENV: staging
  APP_ID: com.grimm.labs.app.staging
  MAESTRO_VERSION: 2.10.0
  # The default driver startup timeout is too short for a freshly booted CI emulator
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
  EMULATOR_API_LEVEL: 35
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  # The runner has 4 vCPUs; 2 cores were not enough and system apps hit ANRs (the dialog hides the app from Maestro)
  EMULATOR_CORES: 3

jobs:
  generate-test-apk:
    if: github.event_name != 'workflow_dispatch' || inputs.apk-run-id == ''
    name: Generate Test APK (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v7

      - name: Create .env.staging
        env:
          BREEZ_API_KEY: ${{ secrets.BREEZ_API_KEY }}
          NOTIFICATION_API_URL: ${{ vars.NOTIFICATION_API_URL_STAGING || 'https://notification-service-staging.usegrimm.app' }}
        run: |
          {
            echo "BREEZ_API_KEY=${BREEZ_API_KEY}"
            echo "YADIO_API_URL=https://api.yadio.io"
            echo "MEMPOOL_URL=https://mempool.space"
            echo "NOTIFICATION_API_URL=${NOTIFICATION_API_URL}"
          } > .env.staging

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Set Up JDK + Generate Test APK
        id: build-apk
        uses: ./.github/actions/setup-jdk-generate-apk
        with:
          APP_ENV: ${{ env.APP_ENV }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Upload Test APK
        uses: actions/upload-artifact@v7
        with:
          name: test-apk
          path: ${{ steps.build-apk.outputs.apk-path }}
          if-no-files-found: error
          retention-days: 7

  test-android:
    name: Run Android E2E Tests (Maestro + Github Action)
    needs: generate-test-apk
    # Also run when the build is skipped because a previous APK is reused
    if: ${{ !cancelled() && (needs.generate-test-apk.result == 'success' || needs.generate-test-apk.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set Up JDK (required by Maestro)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls --retry 3 --retry-all-errors "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download Test APK
        uses: actions/download-artifact@v8
        with:
          name: test-apk
          path: ${{ runner.temp }}/test-apk
          run-id: ${{ inputs.apk-run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api${{ env.EMULATOR_API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-cores${{ env.EMULATOR_CORES }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          cores: ${{ env.EMULATOR_CORES }}
          ram-size: 4096M
          profile: Nexus 6
          script: echo "Generated AVD snapshot for caching."

      # Each line of `script` runs in its own shell: keep multi-command logic on one line
      - name: Run tests with Maestro
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ runner.temp }}/test-apk/app-release.apk
          INCLUDE_TAGS: ${{ inputs.include-tags }}
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: ${{ env.EMULATOR_CORES }}
          ram-size: 4096M
          profile: Nexus 6
          script: |
            mkdir -p e2e-report
            adb shell settings put global hide_error_dialogs 1
            adb install -r "$APK_PATH"
            adb logcat -c
            maestro test .maestro/ --env APP_ID="$APP_ID" ${INCLUDE_TAGS:+--include-tags "$INCLUDE_TAGS"} --format junit --output e2e-report/report.xml --debug-output e2e-report/debug --flatten-debug-output || { adb logcat -d > e2e-report/logcat.txt; exit 1; }

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-report
          path: e2e-report/
          if-no-files-found: ignore
          retention-days: 14
